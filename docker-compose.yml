services:
  # Stats Service
  go-stats-traefik:
    image: ghcr.io/banghasan/go-stats-traefik:latest
    container_name: go-stats-traefik
    restart: unless-stopped
    ports:
      - "9000:8080"
    volumes:
      - ./data:/data
      # Ensure proper permissions by copying database file if needed
    environment:
      - TZ=Asia/Jakarta
    command: ["-host", "0.0.0.0", "-port", "8080", "-db", "/data/stats.db"]
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  default:
    name: traefik-stats
