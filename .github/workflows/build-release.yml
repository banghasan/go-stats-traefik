name: Build and Release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release'
        required: false
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: banghasan/go-stats-traefik

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build binaries
        run: |
          # Build for multiple platforms
          GOOS=linux GOARCH=amd64 go build -ldflags="-w -s" -o bin/go-stats-traefik-linux-amd64
          GOOS=linux GOARCH=arm64 go build -ldflags="-w -s" -o bin/go-stats-traefik-linux-arm64
          GOOS=darwin GOARCH=amd64 go build -ldflags="-w -s" -o bin/go-stats-traefik-darwin-amd64
          GOOS=darwin GOARCH=arm64 go build -ldflags="-w -s" -o bin/go-stats-traefik-darwin-arm64
          GOOS=windows GOARCH=amd64 go build -ldflags="-w -s" -o bin/go-stats-traefik-windows-amd64.exe

      - name: Create or Update Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Latest Release
          draft: false
          prerelease: false
          files: |
            bin/go-stats-traefik-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
